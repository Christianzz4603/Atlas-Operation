name: Native build

on:
  push:
    branches: [native-rust]
  pull_request:
    paths: ['native/**', '.github/workflows/native.yml']
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is built on 22.04 so the binary runs on older glibc (Debian 12 / Ubuntu 22.04 in proot)
          - { name: Linux-x86_64, os: ubuntu-22.04 }
          - { name: Linux-arm64, os: ubuntu-22.04-arm }
          - { name: Windows-x64, os: windows-latest }
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev
      - name: Build (release)
        run: cargo build --release
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/miniwars dist/atlas-miniwars 2>/dev/null || cp target/release/miniwars.exe dist/atlas-miniwars.exe
          cp PLAY-ON-ANDROID.md atlas.cfg.example dist/
          if [ "$RUNNER_OS" = "Linux" ]; then cp run-termux.sh dist/ && chmod +x dist/run-termux.sh dist/atlas-miniwars; fi
          ls -la dist
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: atlas-miniwars-${{ matrix.name }}
          path: native/dist
          if-no-files-found: error

  android:
    name: build (Android-apk)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - name: Build APK (cargo-quad-apk in docker)
        run: |
          docker run --rm -v "$PWD":/root/src -w /root/src notfl3/cargo-apk sh -c "rustup toolchain install stable --profile minimal && rustup default stable && rustup target add aarch64-linux-android x86_64-linux-android && cargo quad-apk build"
      - name: Collect APK
        run: |
          mkdir -p dist
          # target/ is root-owned (built inside docker), so don't `find` it - copy the known path
          sudo chown -R "$USER" target || true
          sudo find target -name "*.apk" -exec ls -la {} \; ; cp target/android-artifacts/debug/apk/miniwars.apk dist/atlas-miniwars.apk
          ls -la dist
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: atlas-miniwars-Android-apk
          path: native/dist
          if-no-files-found: error

  smoke-linux:
    name: smoke test (Linux, xvfb)
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: atlas-miniwars-Linux-x86_64
          path: dist
      - name: Install runtime libs
        run: sudo apt-get update && sudo apt-get install -y xvfb libx11-6 libxi6 libxcursor1 libgl1 libgl1-mesa-dri libasound2 imagemagick
      - name: Run scripted game for 30s
        run: |
          chmod +x dist/atlas-miniwars
          cd dist
          set +e
          ATLAS_AUTOTEST=30 LIBGL_ALWAYS_SOFTWARE=1 timeout 120 xvfb-run -a -s "-screen 0 1280x720x24" ./atlas-miniwars
          echo "exit code: $?"
          set -e
          echo "----- atlas-log.txt -----"
          cat atlas-log.txt
          grep -q "autotest done" atlas-log.txt
          ! grep -q "PANIC" atlas-log.txt
      - name: UI walkthrough (presses every button)
        run: |
          cd dist
          rm -f atlas-log.txt
          set +e
          ATLAS_UITEST=60 LIBGL_ALWAYS_SOFTWARE=1 timeout 150 xvfb-run -a -s "-screen 0 1280x720x24" ./atlas-miniwars
          echo "exit code: $?"
          set -e
          echo "----- atlas-log.txt -----"
          cat atlas-log.txt
          grep -q "uitest done" atlas-log.txt
          ! grep -q "MISSING" atlas-log.txt
          ! grep -q "PANIC" atlas-log.txt

  smoke-android:
    name: smoke test (Android emulator)
    needs: android
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: atlas-miniwars-Android-apk
          path: native/dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator, install and launch the APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          working-directory: native
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/android-smoke.sh
