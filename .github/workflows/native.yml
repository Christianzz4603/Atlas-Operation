name: Native build

on:
  push:
    branches: [native-rust]
  pull_request:
    paths: ['native/**', '.github/workflows/native.yml']
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is built on 22.04 so the binary runs on older glibc (Debian 12 / Ubuntu 22.04 in proot)
          - { name: Linux-x86_64, os: ubuntu-22.04 }
          - { name: Linux-arm64, os: ubuntu-22.04-arm }
          - { name: Windows-x64, os: windows-latest }
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev
      - name: Build (release)
        run: cargo build --release
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/atlas-miniwars dist/ 2>/dev/null || cp target/release/atlas-miniwars.exe dist/
          cp PLAY-ON-ANDROID.md atlas.cfg.example dist/
          if [ "$RUNNER_OS" = "Linux" ]; then cp run-termux.sh dist/ && chmod +x dist/run-termux.sh dist/atlas-miniwars; fi
          ls -la dist
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: atlas-miniwars-${{ matrix.name }}
          path: native/dist
          if-no-files-found: error

  android:
    name: build (Android-apk)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - name: Build APK (cargo-quad-apk in docker)
        run: |
          docker run --rm -v "$PWD":/root/src -w /root/src notfl3/cargo-apk sh -c "rustup toolchain install stable --profile minimal && rustup default stable && rustup target add aarch64-linux-android && cargo quad-apk build"
      - name: Collect APK
        run: |
          mkdir -p dist
          find target -name '*.apk' -print
          find target -name '*.apk' -exec cp {} dist/atlas-miniwars.apk \;
          ls -la dist
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: atlas-miniwars-Android-apk
          path: native/dist
          if-no-files-found: error
